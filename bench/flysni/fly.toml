# Plan 520 step 0: a throwaway Fly app beside repogo-relay, never in front of
# it. Deploy from apps/host: fly deploy -c bench/flysni/fly.toml
app = "repogo-relay-sni-probe"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

# Raw TCP: no tls or http handler, so Fly passes the ClientHello through.
[[services]]
  internal_port = 8443
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[services.ports]]
    port = 443

# The same, with a PROXY v1 header carrying the caller's address.
[[services]]
  internal_port = 8444
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[services.ports]]
    port = 8444
    handlers = ["proxy_proto"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
