# Plan 520's passthrough relay, its own app beside repogo-relay, which keeps
# serving today's apps. Deploy from apps/host: fly deploy -c hrelay/fly.toml
app = "repogo-h-relay"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  HRELAY_NAME = "h.repogo.app"
  HRELAY_PROXY_PROTOCOL = "1"

# Let's Encrypt certificates live here, so a deploy doesn't re-issue them.
[mounts]
  source = "hrelay_data"
  destination = "/data"

[deploy]
  # A volume pins the machine; bluegreen needs a second one.
  strategy = "immediate"

# Raw TCP: Fly never ends TLS here. proxy_proto sends the caller's address
# first, for the per-address cap.
[[services]]
  internal_port = 8443
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["proxy_proto"]

  [services.concurrency]
    type = "connections"
    soft_limit = 4000
    hard_limit = 5000

  [[services.tcp_checks]]
    grace_period = "5s"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
